# PrusaSlicer profile for PowerSpec Ultra / FlashForge Creator-style Sailfish G-code.
# Load with:
#   prusa-slicer --load prusa_powerspec_ultra/powerspec_ultra_left_extruder.ini model.stl --export-gcode
#
# PowerPrint's left physical extruder is T1 on this printer.
# The startup sequence is based on known-good PowerPrint output.

printer_technology = FFF
printer_model = PowerSpec Ultra
printer_variant = 0.4
printer_notes = Center-origin Sailfish/MakerBot-style firmware. Uses left physical extruder T1 and M6 T1 as the heat wait.
bed_shape = -112.5x-74.5,112.5x-74.5,112.5x74.5,-112.5x74.5
max_print_height = 140
z_offset = 0
gcode_flavor = reprap
autoemit_temperature_commands = 0
remaining_times = 0
gcode_comments = 0
gcode_label_objects = disabled
binary_gcode = 0
arc_fitting = disabled
use_relative_e_distances = 0
use_firmware_retraction = 0
use_volumetric_e = 0
extrusion_axis = E
machine_limits_usage = time_estimate_only
output_filename_format = [input_filename_base].g
post_process =

nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
extruder_offset = 0x0
single_extruder_multi_material = 0
ooze_prevention = 0

first_layer_temperature = 205
temperature = 205
first_layer_bed_temperature = 55
bed_temperature = 55
filament_type = PLA
filament_colour = #29B2B2
cooling = 1
fan_always_on = 0
disable_fan_first_layers = 1
min_fan_speed = 35
max_fan_speed = 100
bridge_fan_speed = 100

layer_height = 0.2
first_layer_height = 0.3
perimeters = 3
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = rectilinear
bottom_fill_pattern = monotonic
top_fill_pattern = monotonic
seam_position = aligned
perimeter_generator = arachne
thin_walls = 1
extra_perimeters = 1

perimeter_speed = 40
external_perimeter_speed = 50%
small_perimeter_speed = 15
infill_speed = 60
solid_infill_speed = 30
top_solid_infill_speed = 20
bridge_speed = 25
gap_fill_speed = 20
first_layer_speed = 20
travel_speed = 80
max_print_speed = 80
retract_length = 1
retract_speed = 30
deretract_speed = 30
retract_before_travel = 2
retract_lift = 0
wipe = 0

skirts = 1
skirt_distance = 6
skirt_height = 1
min_skirt_length = 0
brim_width = 0
raft_layers = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 0

start_gcode = M140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature] T1\nG90\nG28\nM132 X Y Z A B\nG1 Z100 F3300\nG1 X-110.5 Y-74 F6000\nM7\nM6 T1\nM907 X100 Y100 Z40 A20 B80\nG1 Z0.6 F3300\nG4 P2000\nM108 T1
end_gcode = M104 S0 T1\nM140 S0\nG1 Z140 F3300\nG28 X0 Y0\nM132 X Y Z A B\nG91\nM18
